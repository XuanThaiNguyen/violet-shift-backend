stages:
  - sync

github_sync:
  stage: sync
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    # Set up the target URL with authentication
    # Format: https://<username>:<token>@github.com/<username>/<repo>.git
    - GH_REPO="https://${GH_USER}:${GH_TOKEN}@github.com/XuanThaiNguyen/violet-shift-backend.git"

    # Configure git
    - git config --global user.email "nguyenxuanthai7@gmail.com"
    - git config --global user.name "XuanThaiNguyen"

    # Add GitHub as a remote and push all branches/tags
    - git remote add github $GH_REPO
    - git push github --mirror
  only:
    - main
    - /^release\/.*$/
